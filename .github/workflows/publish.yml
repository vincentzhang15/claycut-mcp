# Publishes setup-claycut to npm via trusted publishing when a v* tag is pushed.
name: publish
on:
  push:
    tags: ['v*']
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g npm@latest
      - run: npm test
      # surface npm errors as annotations, readable without a GitHub login
      - shell: bash
        run: |
          npm publish 2>&1 | tee publish.log || { echo "::error::$(tail -12 publish.log | tr '\n' ' ')"; exit 1; }
