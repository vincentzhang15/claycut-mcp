# Publishes setup-claycut to npm via trusted publishing when main gets a version not yet on npm.
name: publish
on:
  push:
    branches: [main]
    paths: [cli/package.json, .github/workflows/publish.yml]
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g npm@latest
      - run: npm test
      # surface npm errors as annotations, readable without a GitHub login
      - shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "setup-claycut@$v" version >/dev/null 2>&1; then echo "$v already on npm"; exit 0; fi
          npm publish 2>&1 | tee publish.log || { echo "::error::$(tail -12 publish.log | tr '\n' ' ')"; exit 1; }
